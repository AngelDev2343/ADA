<html>
    <head>
        <title>The Simpsons: Hit & Run | Angel Dev Arcade</title>
        <link rel="icon" href="../favicon.ico" sizes="any" />
        <link rel="icon" href="../favicon.png" type="image/png" />
        <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
            iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
        </style>
    </head>
    <body>
        <iframe data-src="https://shar-wasm.cjoseph.workers.dev/?skipmovie" credentialless allow="cross-origin-isolated; autoplay; fullscreen; gamepad"></iframe>
        <script>
            // en cada entrada se reinstala el service worker desde cero y se recarga con él activo;
            // el juego solo arranca si la página quedó aislada (máximo 3 intentos para no recargar sin fin)
            const frame = document.querySelector("iframe");
            const startGame = () => (frame.src = frame.dataset.src);
            const tries = +sessionStorage.getItem("coi-tries") || 0;

            if (!("serviceWorker" in navigator) || (crossOriginIsolated && tries > 0) || tries >= 3) {
                sessionStorage.removeItem("coi-tries");
                startGame();
            } else {
                sessionStorage.setItem("coi-tries", tries + 1);
                (async () => {
                    for (const reg of await navigator.serviceWorker.getRegistrations()) {
                        if (location.href.startsWith(reg.scope)) await reg.unregister();
                    }
                    const reg = await navigator.serviceWorker.register("coi-sw.js?v=" + Date.now(), { scope: "./", updateViaCache: "none" });
                    const sw = reg.installing || reg.waiting || reg.active;
                    const reloadWhenActive = () => sw.state === "activated" && location.reload();
                    reloadWhenActive();
                    sw.addEventListener("statechange", reloadWhenActive);
                })().catch(startGame);
            }
        </script>
        <script src="../inicio.js"></script>
    </body>
</html>
